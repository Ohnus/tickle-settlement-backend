services:
  postgres:
    image: postgres:17.6
    container_name: tickle-settlement
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - tickle-settlement:/var/lib/postgresql/data

  redis:
    image: redis:7.2
    container_name: tickle-redis
    ports:
      - "${REDIS_PORT}:6379"

volumes:
  tickle-settlement: