name: "Refactor(코드 구조 개선)"
description: 동작 변화 없이 코드 구조/가독성/유지보수성을 개선할 때 사용
title: "[Refactor] "
labels: ["refactor"]
body:
  - type: textarea
    id: target
    attributes:
      label: 개선 대상
      description: 어떤 부분을 리팩터링할 계획인가요?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 현재 문제점
      description: 현재 구조의 어떤 점이 문제인가요? (가독성, 중복, 결합도 등)
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: 개선 방향 (선택)
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 확인사항
      options:
        - label: 기능 동작에는 변화가 없음을 확인했습니다
          required: true
