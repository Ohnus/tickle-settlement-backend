name: "Bug(버그 리포트)"
description: 예상과 다르게 동작하는 부분을 발견했을 때 사용
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 어떤 문제가 발생했나요?
      description: 문제 상황을 구체적으로 설명해주세요
    validations:
      required: true
  - type: textarea
    id: resolve
    attributes:
      label: 해결 방법
      description: 문제를 해결한 방법을 적어주세요
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      options:
        - 낮음
        - 보통
        - 높음
        - 긴급
    validations:
      required: true